.item .t small{color:var(--steel);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;white-space:nowrap}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.line .kind button.on{background:var(--ink);color:var(--bone)}

.tots{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.tots div{display:flex;justify-content:space-between;padding:3px 0}
.tots .T{background:var(--fire);border-radius:10px;padding:10px 12px;margin-top:6px;font-family:'Barlow Condensed';font-weight:800;font-size:22px}
.switch{display:flex;align-items:center;gap:10px;margin:10px 0;cursor:pointer;user-select:none}

.est{display:flex;gap:8px;flex-wrap:wrap}
.est button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px}
.est button.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}

.hint{color:var(--steel);font-size:14px}

// ================= Utilidades =================
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const eur=n=>r2(n).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=s=>{if(!s)return'';const[y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
const PFX={P:'LB',A:'ALB',R:'REC'};
const NAME={P:'Presupuesto',A:'Albarán'};
function nextNum(t){
  const y=new Date().getFullYear(),p=PFX[t]+'-'+y+'-';let max=(S.cfg.ini&&S.cfg.ini[t]||1)-1;
  const all=t==='R'?docs().flatMap(d=>(d.pagos||[]).map(x=>x.rec||'')):docs().filter(d=>d.t===t).map(d=>d.num);
  all.forEach(n=>{if(n&&n.startsWith(p)){const k=parseInt(n.slice(p.length),10);if(k>max)max=k}});
  return p+String(max+1).padStart(3,'0');
}
function tot(d){
  const base=r2((d.l||[]).reduce((s,x)=>s+num(x.q)*num(x.p),0));
  const iva=d.siva?0:r2(base*0.21);const total=r2(base+iva);
  const pag=r2((d.pagos||[]).reduce((s,x)=>s+num(x.imp),0));
  return{base,iva,total,pag,falta:r2(total-pag)};
}
function estado(d){
  const t=tot(d);
  if(d.t==='A'){if(t.total>0&&t.falta<=0.005)return'pagado';if(t.pag>0)return'a cuenta';return'pendiente'}
  if(d.pasado)return'pasado';
  return d.est||'pendiente';
}
const ESTXT={pendiente:'Pendiente',aceptado:'Aceptado',rechazado:'Rechazado',pagado:'Pagado','a cuenta':'Pagado a cuenta',pasado:'Hecho albarán'};
const badge=e=>'<span class="badge b-'+e.replace(' ','-')+'">'+ESTXT[e]+'</span>';

// ================= Vistas =================
let view='docs',filt='todos',q='',cur=null;
function go(v,arg){view=v;cur=arg||null;render();window.scrollTo(0,0);try{history.replaceState(null,'','#'+v)}catch(e){}}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view||(view==='doc'&&b.dataset.v==='docs')||(view==='cli'&&b.dataset.v==='clientes')||(view==='gasto'&&b.dataset.v==='cuentas')));
  $('sendbar').classList.add('hide');
  ({docs:vDocs,doc:vDoc,clientes:vClientes,cli:vCli,ajustes:vAjustes,cuentas:vCuentas,gasto:vGasto})[view]();
}

// ---------- Inicio / documentos ----------
function vDocs(){
  const ds=docs();
  const debe=ds.filter(d=>d.t==='A').reduce((s,d)=>s+Math.max(0,tot(d).falta),0);
  const pend=ds.filter(d=>d.t==='P'&&estado(d)==='pendiente').length;
  $('main').innerHTML=
    '<div class="big"><button class="p" id="nP"><small>+ Nuevo</small><span class="cd">Presupuesto</span></button>'+
    '<button class="a" id="nA"><small>+ Nuevo</small><span class="cd">Albarán</span></button></div>'+
    '<div class="sum"><div><small>Te deben</small><b>'+eur(debe)+'</b></div><div><small>Presupuestos sin respuesta</small><b>'+pend+'</b></div></div>'+
    '<input class="search" id="q" placeholder="Buscar cliente, número o trabajo…" value="'+esc(q)+'">'+
    '<div class="chips" id="ch">'+[['todos','Todos'],['P','Presupuestos'],['A','Albaranes'],['cobrar','Sin cobrar']].map(x=>'<button data-f="'+x[0]+'" class="'+(filt===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div>'+
    '<div class="list" id="ls"></div>';
  $('nP').onclick=()=>newDoc('P');$('nA').onclick=()=>newDoc('A');
  $('q').oninput=e=>{q=e.target.value;fillList()};
  $('ch').onclick=e=>{const b=e.target.closest('button');if(!b)return;filt=b.dataset.f;vDocs()};
  fillList();
}
function fillList(){
  const qq=q.trim().toLowerCase();
  let ds=docs().slice().sort((a,b)=>(b.f||'').localeCompare(a.f||'')||(b.num||'').localeCompare(a.num||''));
  if(filt==='P'||filt==='A')ds=ds.filter(d=>d.t===filt);
  if(filt==='cobrar')ds=ds.filter(d=>d.t==='A'&&tot(d).falta>0.005);
  if(qq)ds=ds.filter(d=>[d.num,d.cl&&d.cl.n,d.asunto].join(' ').toLowerCase().includes(qq));
  $('ls').innerHTML=ds.map(itemHtml).join('')||'<div class="empty">Todavía no hay nada aquí.<br>Toca <b>Nuevo presupuesto</b> o <b>Nuevo albarán</b> para empezar.</div>';
  $('ls').onclick=e=>{const it=e.target.closest('.item');if(it)go('doc',it.dataset.id)};
}
function itemHtml(d){
  const t=tot(d);
  return '<div class="item" data-id="'+d.id+'"><div class="ic '+d.t+'">'+(d.t==='P'?'P':'A')+'</div>'+
    '<div class="t"><b>'+esc(d.cl&&d.cl.n||'Sin cliente')+'</b><small>'+esc(d.num)+' · '+esc(fmtD(d.f))+(d.asunto?' · '+esc(d.asunto):'')+'</small></div>'+
    '<div class="r"><b>'+eur(t.total)+'</b><br>'+badge(estado(d))+'</div></div>';
}
function newDoc(t,cl){
  const d={id:uid(),u:now(),t,num:nextNum(t),f:today(),cl:cl?{n:cl.n,cif:cl.cif,dir:cl.dir,tel:cl.tel,mail:cl.mail}:{n:'',cif:'',dir:'',tel:'',mail:''},
    asunto:'',desc:'',l:[{k:'R',d:'',q:1,p:''},{k:'M',d:'',q:1,p:''}],siva:false,pago:S.cfg.pago,cond:t==='P'?S.cfg.cond:'',est:'pendiente',pagos:[]};
  S.docs.push(d);persist();go('doc',d.id);
}

  $('pg').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.closest('.pay').dataset.i;
    if(b.dataset.a==='del'){if(confirm('¿Quitar este cobro?')){d.pagos.splice(i,1);drawPays();save();if(d.t==='A')vDoc()}}
    else pdfRecibo(d,d.pagos[i],b)};
  const addPay=imp=>{if(!(imp>0)){toast('Pon el importe cobrado');return}
    d.pagos=d.pagos||[];d.pagos.push({id:uid(),f:today(),imp:r2(imp),fp:$('pf').value,rec:nextNum('R')});save();vDoc();toast('Cobro apuntado')};
  $('pAdd').onclick=()=>addPay(num($('pi').value));
  $('pAll').onclick=()=>{const f=tot(d).falta;if(f<=0){toast('Ya está todo cobrado');return}addPay(f)};
  // más
  $('fe').onchange=e=>{d.f=e.target.value||today();save()};
  $('nu').onchange=e=>{d.num=e.target.value.trim()||d.num;save();$('main').querySelector('.num').textContent=d.num};

  $('del').onclick=()=>{if(!confirm('¿Borrar '+d.num+'? No se puede deshacer.'))return;

    S.docs.filter(x=>x.pasado===d.num).forEach(x=>{delete x.pasado;x.u=now()});persist();go('docs')};
  drawLines();drawTot();drawPays();
  // barra de envío
  $('sendbar').classList.remove('hide');
  $('sendin').innerHTML='<button class="btn o" id="sPdf">Enviar al cliente</button>'+(d.cl.tel?'<button class="btn" id="sWa" style="flex:.6">WhatsApp</button>':'')+'<button class="btn l" id="sDl" style="flex:.5">PDF</button>';
  $('sPdf').onclick=e=>sendDoc(d,e.target,'share');
  $('sDl').onclick=e=>sendDoc(d,e.target,'download');
  if($('sWa'))$('sWa').onclick=e=>sendDoc(d,e.target,'wa');
}

// ---------- Cuentas: gastos, IVA y efectivo/banco ----------
const GK={S:'SAT La Latina',T:'Técnico',O:'Otro gasto'};
const FP=['Efectivo','Tarjeta','Transferencia','Bizum'];
const gastos=()=>S.gas.filter(g=>!g.del);
function gt(g){const tot=r2(num(g.tot)),iva=num(g.iva);const base=r2(tot/(1+iva/100));return{tot,base,iva:r2(tot-base)}}
let per={m:'tri',off:0};
function perRange(){
  const d=new Date();let y=d.getFullYear(),a,b,label;
  if(per.m==='mes'){const m=d.getMonth()+per.off;const s=new Date(y,m,1),e=new Date(y,m+1,1);a=s;b=e;
    label=s.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}
  else if(per.m==='tri'){const q=Math.floor(d.getMonth()/3)+per.off;const s=new Date(y,q*3,1),e=new Date(y,q*3+3,1);a=s;b=e;
    label=(Math.floor(s.getMonth()/3)+1)+'.º trimestre '+s.getFullYear()}
  else{a=new Date(y+per.off,0,1);b=new Date(y+per.off+1,0,1);label='Año '+(y+per.off)}
  const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  return{a:iso(a),b:iso(b),label};
}
function vCuentas(){
  const R=perRange(),inR=f=>f&&f>=R.a&&f<R.b;
  const albs=docs().filter(d=>d.t==='A'&&inR(d.f));
  const fact=albs.reduce((s,d)=>{const t=tot(d);s.base+=t.base;s.iva+=t.iva;s.total+=t.total;return s},{base:0,iva:0,total:0});
  const gs=gastos().filter(g=>inR(g.f)).sort((a,b)=>(b.f||'').localeCompare(a.f||''));
  const byK={S:{base:0,iva:0,tot:0,n:0},T:{base:0,iva:0,tot:0,n:0},O:{base:0,iva:0,tot:0,n:0}};
  gs.forEach(g=>{const t=gt(g),o=byK[g.k]||byK.O;o.base+=t.base;o.iva+=t.iva;o.tot+=t.tot;o.n++});
  const gBase=byK.S.base+byK.T.base+byK.O.base,gIva=byK.S.iva+byK.T.iva+byK.O.iva,gTot=byK.S.tot+byK.T.tot+byK.O.tot;
  const hac=r2(fact.iva-gIva);
  // dinero: cobros (por fecha del cobro) y gastos por forma de pago
  const mov={};FP.forEach(f=>mov[f]={in:0,out:0});
  docs().forEach(d=>(d.pagos||[]).forEach(p=>{if(inR(p.f)){(mov[p.fp]||(mov[p.fp]={in:0,out:0})).in+=num(p.imp)}}));
  gs.forEach(g=>{const f=g.fp||'Efectivo';(mov[f]||(mov[f]={in:0,out:0})).out+=gt(g).tot});
  const cash=mov.Efectivo,bank={in:0,out:0};Object.keys(mov).filter(f=>f!=='Efectivo').forEach(f=>{bank.in+=mov[f].in;bank.out+=mov[f].out});
  const row=(l,a,b,c,bold)=>'<tr'+(bold?' style="font-weight:700"':'')+'><td>'+l+'</td><td class="rr">'+a+'</td><td class="rr">'+b+'</td><td class="rr">'+c+'</td></tr>';
  $('main').innerHTML=
    '<div class="bar"><h1>Cuentas</h1><button class="btn o s" id="nG">+ Apuntar gasto</button></div>'+
    '<div class="chips" id="pm">'+[['mes','Mes'],['tri','Trimestre'],['año','Año']].map(x=>'<button data-m="'+x[0]+'" class="'+(per.m===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div>'+
    '<div class="pnav"><button class="btn l s" id="pv">‹</button><b>'+esc(R.label)+'</b><button class="btn l s" id="nx"'+(per.off>=0?' disabled':'')+'>›</button></div>'+
    '<div class="kpi"><div><small>Facturado (albaranes)</small><b>'+eur(fact.total)+'</b><em>'+eur(fact.base)+' + IVA</em></div>'+
    '<div><small>Gastos</small><b>'+eur(gTot)+'</b><em>'+eur(gBase)+' sin IVA</em></div>'+
    '<div class="wide '+(hac>=0?'pay':'back')+'"><small>'+(hac>=0?'IVA a pagar a Hacienda':'Hacienda te devuelve')+'</small><b>'+eur(Math.abs(hac))+'</b><em>IVA cobrado '+eur(fact.iva)+' − IVA pagado '+eur(gIva)+'</em></div>'+
    '<div class="wide"><small>Te queda (sin IVA)</small><b>'+eur(fact.base-gBase)+'</b><em>Facturado sin IVA − gastos sin IVA</em></div></div>'+
    '<h2 class="sec">IVA pagado en gastos</h2><div class="card"><table class="tb"><tr><th></th><th class="rr">Sin IVA</th><th class="rr">IVA</th><th class="rr">Total</th></tr>'+
    ['S','T','O'].map(k=>row(GK[k]+' <small class="hint">('+byK[k].n+')</small>',eur(byK[k].base),eur(byK[k].iva),eur(byK[k].tot))).join('')+
    row('Total',eur(gBase),eur(gIva),eur(gTot),1)+'</table></div>'+
    '<h2 class="sec">Efectivo y tarjeta</h2><div class="card"><table class="tb"><tr><th></th><th class="rr">Entra</th><th class="rr">Sale</th><th class="rr">Queda</th></tr>'+
    row('💶 Efectivo',eur(cash.in),eur(cash.out),eur(cash.in-cash.out),1)+
    row('💳 Banco',eur(bank.in),eur(bank.out),eur(bank.in-bank.out),1)+
    Object.keys(mov).filter(f=>f!=='Efectivo'&&(mov[f].in||mov[f].out)).map(f=>row('<span class="hint">· '+esc(f)+'</span>','<span class="hint">'+eur(mov[f].in)+'</span>','<span class="hint">'+eur(mov[f].out)+'</span>','')).join('')+
    '</table><div class="hint" style="margin-top:8px">Entra = cobros apuntados en albaranes y presupuestos. Sale = gastos.</div></div>'+
    '<h2 class="sec">Gastos del periodo</h2><div class="list" id="lg">'+(gs.map(g=>{const t=gt(g);
      return '<div class="item" data-id="'+g.id+'"><div class="ic G'+g.k+'">'+(g.k==='S'?'SAT':g.k==='T'?'TÉC':'€')+'</div><div class="t"><b>'+esc(g.d||GK[g.k])+'</b><small>'+esc(GK[g.k])+' · '+esc(fmtD(g.f))+' · '+esc(g.fp||'')+'</small></div>'+
      '<div class="r"><b>'+eur(t.tot)+'</b><br><small class="hint">IVA '+(num(g.iva)?eur(t.iva):'no')+'</small></div></div>'}).join('')||'<div class="empty">No hay gastos en este periodo.</div>')+'</div>';
  $('pm').onclick=e=>{const b=e.target.closest('button');if(!b)return;per={m:b.dataset.m,off:0};vCuentas()};
  $('pv').onclick=()=>{per.off--;vCuentas()};$('nx').onclick=()=>{if(per.off<0){per.off++;vCuentas()}};
  $('nG').onclick=()=>{const g={id:uid(),u:now(),k:'S',d:'',f:today(),tot:'',iva:21,fp:'Tarjeta',nuevo:1};S.gas.push(g);go('gasto',g.id)};
  $('lg').onclick=e=>{const it=e.target.closest('.item');if(it)go('gasto',it.dataset.id)};
}
function vGasto(){
  const g=S.gas.find(x=>x.id===cur);if(!g||g.del){go('cuentas');return}
  const draw=()=>{const t=gt(g);$('gt').innerHTML='<div><span>Sin IVA</span><span>'+eur(t.base)+'</span></div><div><span>IVA '+num(g.iva)+' %</span><span>'+eur(t.iva)+'</span></div><div class="T"><span>TOTAL</span><span>'+eur(t.tot)+'</span></div>'};
  $('main').innerHTML='<div class="bar"><button class="back" id="bk">‹ Cuentas</button></div><div class="bar"><h1>Gasto</h1></div>'+
    '<div class="card"><div class="f"><span class="hint">¿Qué es?</span><div class="est" id="gk" style="margin-top:6px">'+['S','T','O'].map(k=>'<button data-k="'+k+'" class="'+(g.k===k?'on':'')+'">'+GK[k]+'</button>').join('')+'</div></div>'+
    '<label class="f" style="margin-top:12px"><span id="gdl">'+(g.k==='T'?'Nombre del técnico y trabajo':g.k==='S'?'Concepto o n.º de factura':'Concepto (gasolina, herramienta…)')+'</span><input class="i" id="gd" value="'+esc(g.d)+'"></label>'+
    '<div class="row2"><label class="f"><span>Total pagado (con IVA)</span><input class="i" id="gtot" inputmode="decimal" placeholder="0,00" value="'+esc(g.tot)+'"></label>'+
    '<label class="f"><span>IVA</span><select class="i" id="giva">'+[21,10,4,0].map(v=>'<option value="'+v+'"'+(num(g.iva)===v?' selected':'')+'>'+(v?v+' %':'Sin IVA')+'</option>').join('')+'</select></label></div>'+
    '<div class="row2"><label class="f"><span>Fecha</span><input class="i" type="date" id="gf" value="'+esc(g.f)+'"></label>'+
    '<label class="f"><span>Pagado con</span><select class="i" id="gfp">'+FP.map(f=>'<option'+(g.fp===f?' selected':'')+'>'+f+'</option>').join('')+'</select></label></div>'+
    '<div class="tots" id="gt"></div></div>'+
    '<button class="btn o" id="gok" style="width:100%">Guardar</button><button class="btn x" id="gdel" style="margin-top:10px">Borrar gasto</button>';
  const save=()=>{g.u=now();delete g.nuevo;persist()};
  $('gk').onclick=e=>{const b=e.target.closest('button');if(!b)return;g.k=b.dataset.k;if(g.k==='T'&&!num(g.tot))g.iva=0;if(g.k!=='T'&&!num(g.tot)&&!num(g.iva))g.iva=21;save();vGasto()};
  $('gd').oninput=e=>{g.d=e.target.value;save()};
  $('gtot').oninput=e=>{g.tot=e.target.value;draw();save()};
  $('giva').onchange=e=>{g.iva=+e.target.value;draw();save()};
  $('gf').onchange=e=>{g.f=e.target.value||today();save()};
  $('gfp').onchange=e=>{g.fp=e.target.value;save()};
  const leave=()=>{if(g.nuevo&&!num(g.tot)&&!g.d){S.gas.splice(S.gas.indexOf(g),1);saveLocal()}go('cuentas')};
  $('bk').onclick=leave;
  $('gok').onclick=()=>{if(!(num(g.tot)>0)){toast('Pon el importe');return}save();toast('Gasto guardado');go('cuentas')};
  $('gdel').onclick=()=>{if(g.nuevo){leave();return}if(confirm('¿Borrar este gasto?')){Object.keys(g).forEach(k=>{if(k!=='id')delete g[k]});g.del=1;g.u=now();persist();go('cuentas')}};
  draw();
}

    '<p class="hint" style="text-align:center;margin-top:24px"><a href="panel.html" style="color:var(--steel)">Abrir la app completa (la de antes)</a></p>';
  document.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{c[i.dataset.k]=i.dataset.k==='validez'?(parseInt(i.value,10)||15):i.value;c.u=now();persist()});
  document.querySelectorAll('[data-n]').forEach(i=>i.onchange=()=>{const n=parseInt(i.value,10);if(n>0){c.ini=Object.assign({},c.ini,{[i.dataset.n]:n});c.u=now();persist();toast('Hecho. Si ya hay uno más alto, sigue desde ese.')}});
  cloud.panel($('nb'));
}

// ================= PDF =================
let LOGO='';
(function(){const svg=new XMLSerializer().serializeToString($('logo'));const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=280;c.getContext('2d').drawImage(im,0,0,280,280);LOGO=c.toDataURL('image/png')}catch(e){}};
  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280"').replace(' stroke="#2a313b" stroke-width="2"',''))})();
function head(){
  const c=S.cfg;
  return '<div class="top"><div class="brand"><img src="'+LOGO+'" alt=""><div><div class="la">LA</div><div class="bg">BRIGADA</div><div class="sub">SERVICIO TÉCNICO · HOSTELERÍA</div></div></div>'+
    '<div class="ct">'+(c.tel?'<b>'+esc(c.tel)+' · WhatsApp</b><br>':'')+esc([c.insta,c.ciudad].filter(Boolean).join(' · '))+'<br>'+esc(c.empresa)+(c.cif?' · CIF '+esc(c.cif):'')+(c.mail?'<br>'+esc(c.mail):'')+'</div></div>';
}
function foot(){return '<div class="grow"></div><div class="foot"><span class="cd">QUE TU COCINA NO PARE</span><span>La Brigada · '+esc(S.cfg.empresa)+'</span></div><div class="stripe"></div>'}
function cliBlock(cl){return '<b style="font-weight:600">'+esc(cl.n||'—')+'</b>'+(cl.cif?'<br>CIF '+esc(cl.cif):'')+(cl.dir?'<br>'+esc(cl.dir).replace(/\n/g,'<br>'):'')+(cl.tel?'<br>Tel. '+esc(cl.tel):'')}
function docHtml(d){
  const t=tot(d),isP=d.t==='P';let n=0;
  const rows=(d.l||[]).filter(x=>x.d||num(x.p)).map((x,i)=>'<tr class="'+(i%2?'':'z')+'"><td>'+String(i+1).padStart(2,'0')+'</td><td>'+(x.k==='R'?'Repuesto: ':'')+esc(x.d)+'</td><td class="r">'+esc(String(x.q).replace('.',','))+'</td><td class="r">'+eur(num(x.p))+'</td><td class="r">'+eur(num(x.q)*num(x.p))+'</td></tr>').join('');
  const sec=(title,body)=>'<h2>'+(++n)+' · '+title+'</h2>'+body;
  const ul=a=>'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  const pago=lines(d.pago);if(S.cfg.iban&&/transfer/i.test(d.pago))pago.push('IBAN: '+S.cfg.iban);
  const meta='<span class="k">N.º</span><span>'+esc(d.num)+'</span><span class="k">FECHA</span><span>'+fmtD(d.f)+'</span>'+
    (isP?'<span class="k">VÁLIDO HASTA</span><span>'+fmtD(addDays(d.f,S.cfg.validez||15))+'</span>':(d.dePres?'<span class="k">PRESUPUESTO</span><span>'+esc(d.dePres)+'</span>':''));
  return '<div class="pg">'+head()+
    '<div class="band"><div><h1>'+(isP?'PRESUPUESTO':'ALBARÁN')+'</h1><div class="s">'+esc(d.asunto||'')+'</div></div><div class="meta">'+meta+'</div></div>'+
    '<div class="two"><div><div class="lb">'+(isP?'PARA':'CLIENTE')+'</div>'+cliBlock(d.cl)+'</div>'+
    (isP?'<div><div class="lb">VALIDEZ</div>Oferta válida '+(S.cfg.validez||15)+' días desde la fecha. Si te encaja, fírmala o contéstanos y nos ponemos en marcha.</div>':'<div><div class="lb">SERVICIO</div>'+esc(d.asunto||'Servicio técnico')+'<br>Fecha: '+fmtD(d.f)+'</div>')+'</div>'+
    (lines(d.desc).length?sec(isP?'Descripción de los trabajos':'Trabajo realizado',ul(lines(d.desc))):'')+
    sec(isP?'Resumen económico':'Detalle','<table><tr><th style="width:30px">#</th><th>Concepto</th><th class="r">Cant.</th><th class="r">Precio ud.</th><th class="r">Importe</th></tr>'+(rows||'<tr><td colspan="5">—</td></tr>')+'</table>'+
      '<div class="tot"><div><span>Base imponible</span><span>'+eur(t.base)+'</span></div><div><span>IVA 21 %</span><span>'+(d.siva?'No incluido':eur(t.iva))+'</span></div><div class="T"><span>TOTAL</span><span>'+eur(t.total)+'</span></div>'+
      (t.pag>0?'<div><span>Pagado a cuenta</span><span>'+eur(t.pag)+'</span></div><div><b>'+(t.falta>0.005?'Pendiente':'Pagado')+'</b><b>'+eur(Math.max(0,t.falta))+'</b></div>':'')+'</div>')+
    (pago.length?sec('Forma de pago',ul(pago)):'')+
    (isP&&lines(d.cond).length?sec('Condiciones del presupuesto',ul(lines(d.cond).concat(['Validez del presupuesto: '+(S.cfg.validez||15)+' días desde su emisión.']))):'')+
    '<div class="sig"><div>Por La Brigada</div><div>Conforme cliente · firma y fecha</div></div>'+foot()+'</div>';
}
function reciboHtml(d,p){
  const t=tot(d);const idx=d.pagos.indexOf(p);const antes=r2(d.pagos.slice(0,idx+1).reduce((s,x)=>s+num(x.imp),0));const falta=r2(t.total-antes);
  return '<div class="pg">'+head()+
    '<div class="band"><div><h1>RECIBO</h1><div class="s">'+(falta>0.005?'Pago a cuenta':'Pago')+' · '+NAME[d.t]+' '+esc(d.num)+'</div></div><div class="meta"><span class="k">N.º</span><span>'+esc(p.rec||'')+'</span><span class="k">FECHA</span><span>'+fmtD(p.f)+'</span></div></div>'+
    '<div class="two"><div><div class="lb">RECIBIDO DE</div>'+cliBlock(d.cl)+'</div><div><div class="lb">CONCEPTO</div>'+(falta>0.005?'Pago a cuenta':'Pago')+' del '+NAME[d.t].toLowerCase()+' '+esc(d.num)+(d.asunto?'<br>'+esc(d.asunto):'')+'</div></div>'+
    '<div class="big"><span>IMPORTE RECIBIDO</span><span>'+eur(num(p.imp))+'</span></div>'+
    '<table><tr><td>Total del '+NAME[d.t].toLowerCase()+' (IVA incluido)</td><td class="r">'+eur(t.total)+'</td></tr><tr><td>Cobrado hasta hoy (con este recibo)</td><td class="r">'+eur(antes)+'</td></tr><tr class="z"><td><b>Pendiente</b></td><td class="r"><b>'+eur(Math.max(0,falta))+'</b></td></tr><tr><td>Forma de pago</td><td class="r">'+esc(p.fp)+'</td></tr></table>'+
    '<div class="sig"><div>Por La Brigada</div><div>Cliente · firma y fecha</div></div>'+foot()+'</div>';
}
async function makePdf(html){
  await document.fonts.ready;
  const el=document.createElement('div');el.innerHTML=html;el.style.cssText='position:fixed;left:-10000px;top:0';document.body.appendChild(el);
  await new Promise(r=>setTimeout(r,60));
  try{
    const canvas=await html2canvas(el.firstChild,{scale:2,backgroundColor:'#ffffff',windowWidth:900});
    const{jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'pt',format:'a4',orientation:'portrait'});
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),per=Math.floor(canvas.width*ph/pw);
    for(let y=0,pg=0;y<canvas.height;y+=per,pg++){
      const h=Math.min(per,canvas.height-y);if(h<40&&pg>0)break;
      const c=document.createElement('canvas');c.width=canvas.width;c.height=h;const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,h);
      cx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);if(pg>0)pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,pw,h*pw/canvas.width);
    }
    return pdf.output('blob');
  }finally{el.remove()}
}
const safe=s=>String(s||'cliente').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40);
function waLink(tel,txt){let n=String(tel||'').replace(/\D/g,'');if(n.length===9)n='34'+n;return 'https://wa.me/'+n+(txt?'?text='+encodeURIComponent(txt):'')}
function msgFor(d){const t=tot(d);return 'Hola'+(d.cl.n?' '+d.cl.n:'')+', te mando el '+NAME[d.t].toLowerCase()+' '+d.num+(d.asunto?' ('+d.asunto+')':'')+': '+eur(t.total)+(d.siva?'':' IVA incluido')+'. Cualquier duda me dices. La Brigada'}
const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function deliver(blob,name,text,mode,d){
  const file=new File([blob],name,{type:'application/pdf'});
  if(mode!=='download'&&mobile&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});return true}catch(e){if(e&&e.name==='AbortError')return false}
  }
  download(blob,name);
  if(mode==='wa'&&d&&d.cl.tel){window.open(waLink(d.cl.tel,text),'_blank');toast('PDF descargado. Adjúntalo en el chat de WhatsApp.')}
  else if(mode==='share'&&d&&d.cl.mail){location.href='mailto:'+encodeURIComponent(d.cl.mail)+'?subject='+encodeURIComponent(NAME[d.t]+' '+d.num+' · La Brigada')+'&body='+encodeURIComponent(text);toast('PDF descargado. Adjúntalo en el correo.')}
  else toast('PDF descargado');
  return true;
}
async function busy(btn,fn){if(!window.html2canvas||!window.jspdf){toast('No cargó el generador de PDF. Recarga la página.');return}
  const l=btn.textContent;btn.disabled=true;btn.textContent='Preparando…';try{await fn()}catch(e){toast('No se pudo crear el PDF'+(e&&e.message?': '+e.message:''))}finally{btn.disabled=false;btn.textContent=l}}
function sendDoc(d,btn,mode){
  if(!(d.cl.n||'').trim()){toast('Pon el nombre del cliente');return}
  rememberCli(d.cl);
  busy(btn,async()=>{const blob=await makePdf(docHtml(d));const ok=await deliver(blob,NAME[d.t].replace('á','a')+'_'+d.num+'_'+safe(d.cl.n)+'.pdf',msgFor(d),mode,d);
    if(ok&&mode!=='download'&&!d.env){d.env=today();d.u=now();persist()}});
}
function pdfRecibo(d,p,btn){busy(btn,async()=>{const blob=await makePdf(reciboHtml(d,p));await deliver(blob,'Recibo_'+(p.rec||'')+'_'+safe(d.cl.n)+'.pdf','Hola, te mando el recibo de tu pago de '+eur(num(p.imp))+'. Gracias. La Brigada','share',null)})}

// ================= Nube (Supabase, misma sesión que la app completa) =================
const cloud=(function(){
  let sb=null,user=null,state='off',pushT=null,busyPull=false;
  const setState=(s,txt)=>{state=s;const n=$('nube');n.className=s==='on'?'on':s==='err'?'err':'';n.querySelector('span').textContent=txt};
  try{if(window.supabase)sb=window.supabase.createClient(CFG_CLOUD.url,CFG_CLOUD.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'lbc-auth'}})}catch(e){}
  const slug=u=>String(u||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9._-]+/g,'');
  function mergeArr(a,b){const m=new Map();(a||[]).forEach(x=>m.set(x.id,x));(b||[]).forEach(x=>{const o=m.get(x.id);if(!o||(x.u||0)>(o.u||0))m.set(x.id,x)});return[...m.values()]}
  async function pull(){
    if(!sb||!user||busyPull)return;busyPull=true;
    try{
      const g=await fetchMerge();
      setState('on','En la nube');
      if(g.changed&&!document.activeElement.matches('input,textarea,select'))render();
      const remoteSame=ARR.concat('cfg').every(k=>JSON.stringify(g(K[k]))===JSON.stringify(S[k]));
      if(!remoteSame)await write();
    }catch(e){setState('err','Sin conexión');console.warn(e)}finally{busyPull=false}
  }
  async function fetchMerge(){
    const{data,error}=await sb.from('datos').select('clave,valor').in('clave',ARR.concat('cfg').map(k=>K[k]));if(error)throw error;
    const g=k=>(data.find(r=>r.clave===k)||{}).valor;
    const before=JSON.stringify(ARR.map(k=>S[k]).concat(S.cfg));
    ARR.forEach(k=>{S[k]=mergeArr(S[k],g(K[k]))});
    const rc=g(K.cfg);if(rc&&(rc.u||0)>(S.cfg.u||0))S.cfg=Object.assign({},DEF_CFG,rc);
    saveLocal();g.changed=JSON.stringify(ARR.map(k=>S[k]).concat(S.cfg))!==before;return g;
  }
  async function write(){
    const ts=new Date().toISOString();
    const{error}=await sb.from('datos').upsert(ARR.concat('cfg').map(k=>({clave:K[k],valor:S[k],actualizado:ts})),{onConflict:'clave'});
    if(error)throw error;
  }
  function push(){if(!sb||!user)return;clearTimeout(pushT);setState('on','Guardando…');pushT=setTimeout(async()=>{
    try{
      // primero traer lo de otros aparatos para no pisarlo
      await fetchMerge();
      await write();setState('on','Guardado en la nube');
    }catch(e){setState('err','No se guardó en la nube');console.warn(e)}},900)}
  async function start(){
    if(!sb){setState('off','Solo en este móvil');return}
    try{const{data}=await sb.auth.getSession();user=data&&data.session&&data.session.user||null}catch(e){}
    if(user){setState('on','Conectando…');pull()}else setState('off','Solo en este móvil');
    sb.auth.onAuthStateChange((ev,ses)=>{const nu=ses&&ses.user||null;const was=user;user=nu;if(nu&&!was){pull()}if(!nu)setState('off','Solo en este móvil');if(view==='ajustes')render()});
  }
  function panel(el){
    if(!sb){el.innerHTML='<div class="hint">La nube no está disponible. Lo que hagas se guarda en este aparato.</div>';return}
    if(user){
      el.innerHTML='<div>Conectado como <b>'+esc((user.email||'').split('@')[0])+'</b>. Lo que hagas se ve igual en el móvil y en el ordenador.</div><div class="adds" style="margin-top:10px"><button class="btn l s" id="sy">Actualizar ahora</button><button class="btn l s" id="so">Salir</button></div>';
      $('sy').onclick=()=>{pull();toast('Actualizado')};
      $('so').onclick=async()=>{await sb.auth.signOut({scope:'local'});user=null;setState('off','Solo en este móvil');render()};
    }else{
      el.innerHTML='<div class="hint" style="margin-bottom:10px">Entra con el mismo usuario de la app de antes para ver tus documentos en el móvil y en el ordenador.</div>'+
        '<form id="lg"><div class="row2"><label class="f"><span>Usuario</span><input class="i" name="u" autocomplete="username" autocapitalize="none"></label><label class="f"><span>Contraseña</span><input class="i" name="p" type="password" autocomplete="current-password"></label></div><button class="btn" type="submit">Entrar</button></form>';
      $('lg').onsubmit=async e=>{e.preventDefault();const f=e.target;const b=f.querySelector('button');b.disabled=true;
        const{error}=await sb.auth.signInWithPassword({email:slug(f.u.value)+'@labrigada.app',password:f.p.value});b.disabled=false;
        if(error){toast('Usuario o contraseña incorrectos');return}toast('Dentro')};
    }
  }
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull()});
  setInterval(()=>{if(document.visibilityState==='visible')pull()},60000);
  return{push,pull,start,panel};
})();

// ================= Arranque =================
const h=(location.hash||'').slice(1);if(['docs','clientes','ajustes','cuentas'].includes(h))view=h;
render();cloud.start();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
